name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # PluginVersion は Claude Code プラグインのマニフェストに載る。
      # タグと食い違うと、実体と違うバージョンを名乗るプラグインが配布される。
      - name: Verify the tag matches PluginVersion
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -oE 'PluginVersion = "[^"]+"' cmd/root.go | cut -d'"' -f2)
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with PluginVersion ($declared) in cmd/root.go"
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
